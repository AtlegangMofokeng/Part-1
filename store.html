<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>410 Kagiso - Store</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav>
        <img src="images/Sesame Street Sign Template.jpg" alt="brand logo" class="center">
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="store.html" class="active">Store</a>
            <a href="celebrate.html">Celebrate Us</a>
        </div>
        <div class="cart-icon" onclick="goToCart()">🛒 <span class="cart-count">0</span></div>
    </nav>

    <!-- Currency Selector -->
    <div class="currency-wrapper">
        <label>Currency:</label>
        <div class="custom-select">
            <div class="selected">🇿🇦 ZAR ▼</div>
            <div class="options">
                <div class="option" data-value="ZAR">🇿🇦 ZAR</div>
                <div class="option" data-value="USD">🇺🇸 USD</div>
                <div class="option" data-value="EUR">🇪🇺 EUR</div>
                <div class="option" data-value="GBP">🇬🇧 GBP</div>
                <div class="option" data-value="JPY">🇯🇵 JPY</div>
            </div>
        </div>
    </div>
</header>

<main class="store">
    <h2>Our Headwear Collection</h2>
    <div class="product-grid">

        <!-- PRODUCT 1 -->
        <div class="product-card sunhat">
            <div class="slideshow-container-p1">
                <div class="p1Slide active"><img src="images/Screenshot_20250827_132218_Instagram.jpg" alt="Sun Hat 1"></div>
                <div class="p1Slide"><img src="images/hats.jpg" alt="Sun Hat 2"></div>
                <a class="prevP1" onclick="plusSlidesP1(-1)">❮</a>
                <a class="nextP1" onclick="plusSlidesP1(1)">❯</a>
            </div>
            <div class="dotsP1">
                <span class="dotP1 activeP1" onclick="currentSlideP1(1)"></span>
                <span class="dotP1" onclick="currentSlideP1(2)"></span>
            </div>
            <h3>Sun Hat</h3>
            <p>Price: <span class="price-display" data-price="180">R180</span></p>
            <div class="color-options">
                <span class="color-circle black" onclick="showColor('black', this)"></span>
                <span class="color-circle lightpink" onclick="showColor('lightpink', this)"></span>
                <span class="color-circle yellow" onclick="showColor('yellow', this)"></span>
                <span class="color-circle lightgreen" onclick="showColor('lightgreen', this)"></span>
                <span class="color-circle darkblue" onclick="showColor('darkblue', this)"></span>
                <span class="color-circle lightgrey" onclick="showColor('lightgrey', this)"></span>
                <span class="color-circle darkpink" onclick="showColor('darkpink', this)"></span>
            </div>
            <div class="qty-wrapper">
                <button class="qty-btn minus">-</button>
                <input type="number" class="qty-input" value="1" min="1">
                <button class="qty-btn plus">+</button>
            </div>
            <button class="add-cart" data-product="Sun Hat" data-price="180">Add to Cart</button>
        </div>

        <!-- PRODUCT 2 -->
        <div class="product-card caps">
            <img src="images/3 caps.jpg" alt="Stylish Caps">
            <h3>Stylish Caps</h3>
            <p>Price: <span class="price-display" data-price="150">R150</span></p>
            <div class="color-options2">
                <span class="color-circle2 brown" onclick="showColor2('brown', this)"></span>
                <span class="color-circle2 skyblue" onclick="showColor2('skyblue', this)"></span>
                <span class="color-circle2 darkblue" onclick="showColor2('darkblue', this)"></span>
                <span class="color-circle2 red" onclick="showColor2('red', this)"></span>
                <span class="color-circle2 yellow" onclick="showColor2('yellow', this)"></span>
                <span class="color-circle2 orange" onclick="showColor2('orange', this)"></span>
                <span class="color-circle2 purple" onclick="showColor2('purple', this)"></span>
                <span class="color-circle2 lightpink" onclick="showColor2('lightpink', this)"></span>
            </div>
            <div class="qty-wrapper">
                <button class="qty-btn minus">-</button>
                <input type="number" class="qty-input" value="1" min="1">
                <button class="qty-btn plus">+</button>
            </div>
            <button class="add-cart" data-product="Stylish Caps" data-price="150">Add to Cart</button>
        </div>

    </div>
</main>

<footer>
    <p>&copy; Copyright - Kagiso 2025</p>
</footer>

<script src="index.js"></script>
</body>
</html>
